# Publishes theme.zip on every version tag. The store reads the latest
# release's theme.zip; its manifest version must match the tag.
# To publish an existing tag again: gh workflow run release.yml --ref <tag>
name: Release
on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the manifest version matches the tag
        run: |
          version=$(jq -r .version manifest.json)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::manifest.json version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Build theme.zip
        run: zip -r theme.zip manifest.json theme.css $(ls -d fonts images 2>/dev/null)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release published by hand keeps its theme.zip: the store pins
          # the file it checked by its SHA-256.
          if gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' 2>/dev/null | grep -qx theme.zip; then
            echo "$GITHUB_REF_NAME already has theme.zip"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" theme.zip --title "$GITHUB_REF_NAME" --generate-notes
